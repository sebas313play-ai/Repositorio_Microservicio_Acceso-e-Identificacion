spring.application.name=nexa-acceso
server.port=8081
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nexa_acceso?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
app.jwt.secret=${JWT_SECRET:CAMBIAR_ESTA_CLAVE_POR_UN_SECRETO_BASE64_DE_AL_MENOS_32_BYTES}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.bootstrap.admin-username=${ADMIN_USERNAME:admin}
app.bootstrap.admin-email=${ADMIN_EMAIL:admin@nexa.local}
app.bootstrap.admin-password=${ADMIN_PASSWORD:Cambiar123!}
